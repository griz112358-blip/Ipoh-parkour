<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>橙子跑酷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #1a1a2e;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Courier New', monospace;
    }
    #level-select {
      width: 100%;
      padding: 10px 5px;
      background: #1a1a2e;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      z-index: 100;
    }
    #level-select button {
      background: #ff6b6b;
      color: #fff;
      border: 2px solid #ffd700;
      padding: 8px 12px;
      margin: 0 4px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      border-radius: 5px;
    }
    #level-select button:hover {
      background: #ffd700;
      color: #000;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 60vh;
      min-height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game {
      border: 4px solid #eee;
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
    #ui {
      position: absolute;
      top: 10px;
      color: #fff;
      text-align: center;
      z-index: 10;
    }
    #level-info { font-size: 20px; margin-bottom: 5px; }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffd700;
      font-size: 28px;
      text-shadow: 2px 2px #000;
      display: none;
      z-index: 20;
    }
    #controls {
      width: 100%;
      max-width: 800px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a2e;
      min-height: 90px;
    }
    .control-group {
      display: flex;
      gap: 10px;
    }
    .ctrl-btn {
      width: 70px;
      height: 60px;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      border-radius: 10px;
      color: #fff;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      background: rgba(255,255,255,0.4);
    }
    .ctrl-btn.jump {
      background: rgba(255,107,107,0.3);
      border-color: #ff6b6b;
    }
    .ctrl-btn.knock {
      background: rgba(255,215,0,0.3);
      border-color: #ffd700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="level-select">
    <button onclick="loadLevel(1)">1</button>
    <button onclick="loadLevel(2)">2</button>
    <button onclick="loadLevel(3)">3</button>
    <button onclick="loadLevel(4)">4</button>
    <button onclick="loadLevel(5)">5</button>
    <button onclick="loadLevel(6)">6</button>
    <button onclick="loadLevel(7)">7</button>
    <button onclick="loadLevel(8)">8</button>
    <button onclick="loadLevel(9)">9</button>
  </div>
  <div id="game-container">
    <div id="ui">
      <div id="level-info">第 <span id="level-num">1</span> 关</div>
    </div>
    <canvas id="game" width="800" height="500"></canvas>
    <div id="message">过关! 🎉</div>
  </div>
  <div id="controls">
    <div class="control-group">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="control-group">
      <div class="ctrl-btn knock" id="btn-knock">敲门</div>
      <div class="ctrl-btn jump" id="btn-jump">↑</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('message');
const levelNumEl = document.getElementById('level-num');

function resizeCanvas() {
  const container = document.getElementById('game-container');
  const maxWidth = Math.min(container.clientWidth - 20, 800);
  const maxHeight = container.clientHeight - 20;
  const aspect = 800 / 500;
  let w = maxWidth;
  let h = w / aspect;
  if (h > maxHeight) { h = maxHeight; w = h * aspect; }
  canvas.width = 800;
  canvas.height = 500;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let currentLevel = 1;
let gameState = 'playing';
let wasAtDoor = false;
let doorHint = null;
let doorWarning = null;
let cameraY = 0;

const GRAVITY = 0.6;
const JUMP_FORCE = -12;
const SPEED = 5;
const keys = {};

const player = { x: 50, y: 0, w: 30, h: 40, vx: 0, vy: 0, onGround: false, hasKey: false, knockCount: 0, lastKnockTime: 0, spacePressed: false, color: '#ff6b6b' };
const groundY = 420;
const MAX_LEVEL = 9;

const levels = {
  1: { platforms: [{x:0,y:groundY,w:800,h:80}], door:{x:700,y:groundY-60,w:40,h:60}, box:null, key:null, lockedDoor:null, playerStart:{x:50,y:groundY-40} },
  2: { platforms: [{x:0,y:groundY,w:800,h:80},{x:500,y:260,w:200,h:20}], door:{x:620,y:200,w:40,h:60}, box:{x:200,y:groundY-50,w:50,h:50}, key:null, lockedDoor:null, playerStart:{x:50,y:groundY-40} },
  3: { platforms: [{x:0,y:groundY,w:800,h:80}], door:null, box:null, key:{x:350,y:groundY-30,w:25,h:25}, lockedDoor:{x:650,y:groundY-60,w:40,h:60,locked:true}, playerStart:{x:50,y:groundY-40} },
  4: { platforms: [{x:0,y:groundY,w:800,h:80}], door:{x:700,y:groundY-60,w:40,h:60,knockRequired:3}, box:null, key:null, lockedDoor:null, playerStart:{x:50,y:groundY-40} },
  5: { type:'find', platforms:[{x:0,y:groundY,w:800,h:80}], hidden:[{x:150,y:groundY-30,w:40,h:30,found:false,name:'草丛'},{x:320,y:80,w:120,h:60,found:false,name:'牌子'}], found:0,total:2, playerStart:{x:50,y:groundY-40} },
  6: { platforms:[{x:0,y:groundY,w:800,h:80},{x:500,y:180,w:200,h:20}], door:{x:620,y:120,w:40,h:60}, boxes:[{x:100,y:groundY-50,w:50,h:50,dragging:false},{x:180,y:groundY-50,w:50,h:50,dragging:false},{x:260,y:groundY-50,w:50,h:50,dragging:false}], key:null, lockedDoor:null, playerStart:{x:50,y:groundY-40} },
  7: { type:'ice', platforms:[{x:0,y:groundY,w:800,h:80},{x:0,y:200,w:250,h:20}], door:{x:380,y:groundY-60,w:40,h:60,knockRequired:3}, ice:{x:150,y:groundY-15,w:500,h:15,melted:false}, fire:{x:50,y:150,w:40,h:40,dragging:false}, playerStart:{x:50,y:groundY-40}, iceMelted:false },
  8: { type:'spa', platforms:[{x:0,y:groundY,w:800,h:80}], spaPool:{x:40,y:groundY-40,w:140,h:40}, npcs:[{x:60,y:groundY-70,w:20,h:30},{x:110,y:groundY-72,w:20,h:32}], trapPool:{x:360,y:groundY-40,w:120,h:40}, door:{x:700,y:groundY-60,w:40,h:60,keyRequired:true}, obstacles:[{x:260,y:groundY-80,w:60,h:80},{x:520,y:groundY-80,w:60,h:80}], clothes:[], clothesChosen:false, chosenCloth:null, npcGone:false, spaKeyGiven:false, messageTimer:0, keyHintTimer:0, playerStart:{x:220,y:groundY-40} },
  9: { type:'drop', platforms:[{x:80,y:220,w:80,h:20},{x:220,y:220,w:80,h:20},{x:360,y:220,w:80,h:20},{x:500,y:220,w:80,h:20},{x:640,y:220,w:160,h:20}], fakeDoor:{x:660,y:160,w:40,h:60}, realGroundY:groundY+260, realPlatforms:[{x:0,y:groundY+260,w:800,h:80}], door:{x:700,y:groundY+200,w:40,h:60}, box:null, key:null, lockedDoor:null, hasDropped:false, dropTargetOffset:260, playerStart:{x:100,y:180} }
};
let level = levels[1];

function loadLevel(n) {
  currentLevel = n;
  level = levels[n];
  cameraY = 0;
  player.x = level.playerStart.x;
  player.y = level.playerStart.y;
  player.vx = 0; player.vy = 0;
  player.hasKey = false;
  player.knockCount = 0;
  player.lastKnockTime = 0;
  player.spacePressed = false;
  levelNumEl.textContent = n;
  msgEl.style.display = 'none';
  gameState = 'playing';
  if (level.type === 'spa') resetSpaLevelState();
}

function drawRect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function drawPlayer(){ drawRect(player.x,player.y,player.w,player.h,player.color); drawRect(player.x+18,player.y+8,6,6,'#fff'); drawRect(player.x+18,player.y+8,2,2,'#000'); }
function drawDoor(d){ if(!d)return; drawRect(d.x,d.y,d.w,d.h,'#4a4a4a'); drawRect(d.x+4,d.y+4,d.w-8,d.h-4,d.locked?'#8b4513':'#2d2d2d'); if(!d.locked)drawRect(d.x+d.w-10,d.y+30,6,6,'#ffd700'); }
function drawBox(b){ if(!b)return; drawRect(b.x,b.y,b.w,b.h,'#8b6914'); drawRect(b.x+5,b.y+5,b.w-10,2,'#6b4f0f'); drawRect(b.x+5,b.y+b.h-7,b.w-10,2,'#6b4f0f'); }
function drawKey(k){ if(!k)return; drawRect(k.x+8,k.y+2,10,10,'#ffd700'); drawRect(k.x+5,k.y+12,4,10,'#ffd700'); }
function drawPlatform(p){ drawRect(p.x,p.y,p.w,p.h,'#3d5a3d'); drawRect(p.x,p.y,p.w,8,'#5a8f5a'); }

function draw(){
  drawRect(0,0,canvas.width,canvas.height,'#1a1a2e');
  ctx.save();
  ctx.translate(0,-cameraY);
  level.platforms.forEach(drawPlatform);
  
  if(level.type==='find'){
    drawRect(300,50,160,80,'#8b4513');
    ctx.fillStyle='#fff';ctx.font='18px Courier New';
    ctx.fillText('找出隐藏人物',310,90);
    drawRect(130,groundY-20,80,20,'#228b22');
    level.hidden.forEach(h=>{if(h.found){drawRect(h.x+10,h.y,20,35,'#ff69b4');drawRect(h.x+14,h.y+4,4,4,'#000');}});
    ctx.fillStyle='#ffd700';ctx.fillText(`找到: ${level.found}/${level.total}`,20,40);
  }
  
  if(level.type==='spa'){
    if(level.obstacles)level.obstacles.forEach(o=>drawRect(o.x,o.y,o.w,o.h,'#654321'));
    if(level.spaPool){drawRect(level.spaPool.x,level.spaPool.y,level.spaPool.w,level.spaPool.h,'#5a3c1a');drawRect(level.spaPool.x+4,level.spaPool.y+4,level.spaPool.w-8,level.spaPool.h-8,'#3fa9f5');if(!level.npcGone&&level.npcs)level.npcs.forEach(n=>{drawRect(n.x,n.y,n.w,n.h,'#ffb6c1');drawRect(n.x+6,n.y+4,4,4,'#000');});}
    if(level.trapPool){drawRect(level.trapPool.x,level.trapPool.y,level.trapPool.w,level.trapPool.h,'#5a3c1a');drawRect(level.trapPool.x+4,level.trapPool.y+4,level.trapPool.w-8,level.trapPool.h-8,'#8b0000');}
    if(level.clothes&&!level.clothesChosen)level.clothes.forEach(c=>{drawRect(c.x,c.y,c.w,c.h,c.type==='lucky'?'#ff3030':'#cccccc');ctx.fillStyle='#000';ctx.fillText(c.type==='lucky'?'福':'普',c.x+6,c.y+18);});
  }
  
  if(level.type==='drop'){if(level.fakeDoor)drawDoor(level.fakeDoor);if(level.realPlatforms)level.realPlatforms.forEach(drawPlatform);}
  
  drawBox(level.box);
  if(level.boxes)level.boxes.forEach(b=>drawBox(b));
  drawKey(level.key);
  
  if(level.type==='ice'){
    if(level.ice&&!level.ice.melted){drawRect(level.ice.x,level.ice.y,level.ice.w,level.ice.h,'#87ceeb');drawRect(level.ice.x+5,level.ice.y+3,30,4,'#fff');}
    if(level.fire){drawRect(level.fire.x,level.fire.y+35,40,10,'#8b4513');const f=Math.random()*4;drawRect(level.fire.x+5,level.fire.y+10+f,30,30-f,'#ff4500');drawRect(level.fire.x+10,level.fire.y+5+f,20,20-f,'#ff6600');}
    if(!level.iceMelted){ctx.fillStyle='#fff';ctx.fillText('拖动火焰化冰',200,50);}
  }
  
  drawDoor(level.door);
  drawDoor(level.lockedDoor);
  
  if(doorHint){ctx.fillStyle='#ffd700';ctx.fillText(doorHint.text,doorHint.x,doorHint.y);}
  if(doorWarning){ctx.fillStyle='#ff6b6b';ctx.fillText(doorWarning.text,doorWarning.x,doorWarning.y);}
  drawPlayer();
  
  if(player.hasKey&&level.lockedDoor?.locked){ctx.fillStyle='#fff';ctx.fillText('钥匙已获得!',50,50);}
  
  ctx.restore();
  if(gameState==='won'){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ffd700';ctx.font='36px Courier New';ctx.textAlign='center';ctx.fillText('已过关! 🎉',canvas.width/2,canvas.height/2);ctx.textAlign='left';}
}

function update(){
  if(gameState!=='playing')return;
  doorHint=null;doorWarning=null;
  
  let onIce=false;
  if(level.type==='ice'){
    const pb=player.y+player.h,pcx=player.x+player.w/2;
    if(level.ice&&!level.ice.melted&&pcx>=level.ice.x&&pcx<=level.ice.x+level.ice.w&&pb>=level.ice.y-5&&pb<=level.ice.y+20)onIce=true;
  }
  
  if(keys['ArrowLeft']||keys['a']||keys['left']){player.vx=onIce?-SPEED*1.5:-SPEED;}
  else if(keys['ArrowRight']||keys['d']||keys['right']){player.vx=onIce?SPEED*1.5:SPEED;}
  else if(onIce){if(player.vx>0)player.vx=Math.max(0,player.vx-0.1);else if(player.vx<0)player.vx=Math.min(0,player.vx+0.1);}
  else{player.vx=0;}
  
  if((keys['ArrowUp']||keys['w']||keys['up']||keys['jump'])&&player.onGround){player.vy=JUMP_FORCE;player.onGround=false;}
  
  if((keys[' ']||keys['knock'])&&!player.spacePressed){if(level.door?.knockRequired&&wasAtDoor){player.knockCount++;}player.spacePressed=true;}
  else if(!keys[' ']&&!keys['knock']){player.spacePressed=false;}
  
  player.vy+=GRAVITY;
  player.x+=player.vx;
  player.y+=player.vy;
  
  if(level.boxes){level.boxes.forEach(b=>{if(!b.dragging){b.y+=5;level.platforms.forEach(p=>{if(b.x+b.w>p.x&&b.x<p.x+p.w&&b.y+b.h>p.y&&b.y<p.y+p.h)b.y=p.y-b.h;});if(b.y+b.h>groundY)b.y=groundY-b.h;}});}
  
  if(player.x<0)player.x=0;
  if(player.x+player.w>canvas.width)player.x=canvas.width-player.w;
  
  player.onGround=false;
  level.platforms.forEach(p=>{if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>p.y&&player.y+player.h<p.y+20&&player.vy>0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}});
  
  if(currentLevel===9&&level.type==='drop'){if(!level.hasDropped&&player.y>260)level.hasDropped=true;if(level.hasDropped){const t=level.dropTargetOffset||260;if(cameraY<t){cameraY+=4;if(cameraY>t)cameraY=t;}level.realPlatforms.forEach(p=>{if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>p.y&&player.y+player.h<p.y+20&&player.vy>0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}});}}
  
  if(currentLevel===8&&level.type==='spa'&&level.obstacles){level.obstacles.forEach(o=>{if(player.x+player.w>o.x&&player.x<o.x+o.w&&player.y+player.h>o.y&&player.y+player.h<o.y+20&&player.vy>0){player.y=o.y-player.h;player.vy=0;player.onGround=true;}if(player.y+player.h>o.y+10&&player.y<o.y+o.h){if(player.x+player.w>o.x&&player.x<o.x&&player.vx>0)player.x=o.x-player.w;else if(player.x<o.x+o.w&&player.x>o.x+o.w-5&&player.vx<0)player.x=o.x+o.w;}});}
  
  if(level.type==='ice'){if(level.ice&&!level.ice.melted&&player.x+player.w>level.ice.x&&player.x<level.ice.x+level.ice.w&&player.y+player.h>level.ice.y&&player.y+player.h<level.ice.y+20&&player.vy>0){player.y=level.ice.y-player.h;player.vy=0;player.onGround=true;}}
  
  if(level.box){const b=level.box;if(player.x+player.w>b.x&&player.x<b.x+b.w){if(player.y+player.h>b.y&&player.y+player.h<b.y+20&&player.vy>0){player.y=b.y-player.h;player.vy=0;player.onGround=true;}else if(player.y+player.h>b.y+10){if(player.x+player.w>b.x&&player.x<b.x+10&&player.vx>0){b.x=player.x+player.w;if(b.x+b.w>canvas.width)b.x=canvas.width-b.w;}else if(player.x<b.x+b.w&&player.x>b.x+b.w-10&&player.vx<0){b.x=player.x-b.w;if(b.x<0)b.x=0;}}}}
  
  if(level.boxes){level.boxes.forEach(b=>{if(player.x+player.w>b.x&&player.x<b.x+b.w){if(player.y+player.h>b.y&&player.y+player.h<b.y+20&&player.vy>0){player.y=b.y-player.h;player.vy=0;player.onGround=true;}});}
  
  if(currentLevel===8&&level.type==='spa'){const s=levels[8];if(s.trapPool){const t=s.trapPool;if(player.x+player.w>t.x&&player.x<t.x+t.w&&player.y+player.h>t.y&&player.y<t.y+t.h){restartCurrentLevel();return;}}if(!s.spaKeyGiven&&s.chosenCloth==='lucky'&&s.spaPool){const pc=player.x+player.w/2,pb=player.y+player.h;if(pc>=s.spaPool.x&&pc<=s.spaPool.x+s.spaPool.w+5&&pb>=s.spaPool.y-5&&pb<=s.spaPool.y+s.spaPool.h+10){s.npcGone=true;player.hasKey=true;s.spaKeyGiven=true;s.messageTimer=180;s.keyHintTimer=240;}}if(s.messageTimer>0)s.messageTimer--;if(s.keyHintTimer>0)s.keyHintTimer--;}
  
  if(level.key){const k=level.key;if(player.x+player.w>k.x&&player.x<k.x+k.w&&player.y+player.h>k.y&&player.y<k.y+k.h){player.hasKey=true;level.key=null;}}
  
  if(level.door){const d=level.door;const canEnter=!(currentLevel===9&&level.type==='drop'&&!level.hasDropped);const atX=player.x+player.w>d.x-10&&player.x<d.x+d.w+10;const atY=player.y+player.h>d.y&&player.y<d.y+d.h;const at=atX&&atY;if(!at&&wasAtDoor){player.knockCount=0;player.spacePressed=false;}wasAtDoor=at;if(canEnter&&at){if(d.knockRequired){doorHint={text:`敲门:${player.knockCount}/${d.knockRequired}`,x:d.x-30,y:d.y-15};if(level.type==='ice'&&!level.iceMelted){doorWarning={text:'冰未融化!',x:d.x-40,y:d.y-40};}else if(player.knockCount>=d.knockRequired){nextLevel();}}else if(d.keyRequired&&currentLevel===8){if(player.hasKey)nextLevel();else doorWarning={text:'需钥匙',x:d.x-30,y:d.y-40};}else{nextLevel();}}}
  
  if(level.lockedDoor&&level.lockedDoor.locked){const d=level.lockedDoor;if(player.x+player.w>d.x&&player.x<d.x+d.w&&player.y+player.h>d.y){if(player.hasKey){level.lockedDoor.locked=false;player.hasKey=false;}}}
  
  if(level.lockedDoor&&!level.lockedDoor.locked){const d=level.lockedDoor;if(player.x+player.w>d.x&&player.x<d.x+d.w&&player.y+player.h>d.y){nextLevel();}}
}

function nextLevel(){gameState='won';msgEl.style.display='block';setTimeout(()=>{if(currentLevel<MAX_LEVEL){currentLevel++;loadLevel(currentLevel);}else{msgEl.textContent='🎉 全部通关! 🎉';document.getElementById('level-select').style.display='flex';}},1500);}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}

document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>keys[e.key]=false);

function setupBtn(id,k){const b=document.getElementById(id);b.addEventListener('mousedown',e=>{e.preventDefault();keys[k]=true;});b.addEventListener('mouseup',e=>keys[k]=false);b.addEventListener('mouseleave',e=>keys[k]=false);b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true;},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false;},{passive:false});}
setupBtn('btn-left','left');setupBtn('btn-right','right');setupBtn('btn-jump','jump');setupBtn('btn-knock',' ');

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=canvas.width/r.width,sy=canvas.height/r.height;
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return{x:(cx-r.left)*sx,y:(cy-r.top)*sy};
}

function handleClick(e){
  if(currentLevel===5&&level.type==='find'){
    const p=getPos(e);
    level.hidden.forEach(h=>{if(!h.found&&p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.found=true;level.found++;if(level.found>=level.total){setTimeout(()=>{gameState='won';msgEl.textContent='🎉 找到全部! 🎉';msgEl.style.display='block';setTimeout(()=>{currentLevel=6;loadLevel(6);},2000);},500);}}});
  }
  if(currentLevel===8&&level.type==='spa'){
    const p=getPos(e);
    const s=levels[8];
    if(!s.clothesChosen&&s.clothes){s.clothes.forEach(c=>{if(p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h){s.clothesChosen=true;s.chosenCloth=c.type;player.color=c.type==='lucky'?'#ff0000':'#ff6b6b';}});}
  }
}

canvas.addEventListener('click',handleClick);
canvas.addEventListener('touchend',e=>{e.preventDefault();handleClick(e);},{passive:false});

let dragF=null,dragB=null;

function handleDragS(e){
  e.preventDefault();
  const p=getPos(e);
  if(currentLevel===7&&level.fire){
    const f=level.fire;
    if(p.x>=f.x-10&&p.x<=f.x+f.w+10&&p.y>=f.y-10&&p.y<=f.y+f.h+10){dragF=f;f.dragging=true;return;}
  }
  if(currentLevel===6&&level.boxes){
    level.boxes.forEach(b=>{if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){dragB=b;b.dragging=true;}});
  }
}

function handleDragM(e){
  if(!dragF&&!dragB)return;
  e.preventDefault();
  const p=getPos(e);
  if(dragF){
    dragF.x=p.x-dragF.w/2;dragF.y=p.y-dragF.h/2;
    if(level.ice&&!level.ice.melted&&dragF.x+dragF.w>level.ice.x&&dragF.x<level.ice.x+level.ice.w&&dragF.y+dragF.h>level.ice.y){level.ice.melted=true;level.iceMelted=true;dragF.dragging=false;dragF=null;}
  }
  if(dragB){dragB.x=p.x-dragB.w/2;dragB.y=p.y-dragB.h/2;}
}

function handleDragE(e){
  if(dragB){dragB.dragging=false;dragB=null;}
  if(dragF){dragF.dragging=false;dragF=null;}
}

canvas.addEventListener('mousedown',handleDragS);
canvas.addEventListener('mousemove',handleDragM);
canvas.addEventListener('mouseup',handleDragE);
canvas.addEventListener('mouseleave',handleDragE);
canvas.addEventListener('touchstart',handleDragS,{passive:false});
canvas.addEventListener('touchmove',handleDragM,{passive:false});
canvas.addEventListener('touchend',handleDragE,{passive:false});

function resetSpaLevelState(){
  const l=levels[8];
  if(!l)return;
  const bx=l.playerStart.x,by=l.playerStart.y-80;
  l.clothes=[{x:bx-30,y:by,w:30,h:30,type:'normal'},{x:bx+20,y:by,w:30,h:30,type:'lucky'}];
  l.clothesChosen=false;l.chosenCloth=null;l.npcGone=false;l.spaKeyGiven=false;
}

function restartCurrentLevel(){if(currentLevel===8&&level.type==='spa')resetSpaLevelState();loadLevel(currentLevel);}

loadLevel(1);
gameLoop();
</script>
